<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السحر الخيالي - AI Generator</title>
    <style>
        /* ظبط الألوان الأساسية - Dark Theme */
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent-color: #6366f1;
            --text-color: #e4e4e7;
            --polaroid-white: #f9f9fb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 5px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        p.subtitle {
            color: #a1a1aa;
            margin-bottom: 30px;
        }

        /* صندوق الإدخال والزرار */
        .input-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 40px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #27272a;
            border: 1px solid #3f3f46;
            padding: 14px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #4f46e5;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #3f3f46;
            cursor: not-allowed;
        }

        /* معرض الصور بنظام الـ Grid */
        .gallery-grid {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        /* ستايل كارت الـ Polaroid الجامد */
        .polaroid-card {
            background: var(--polaroid-white);
            padding: 15px 15px 25px 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            transform: rotate(-1s);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.6s ease-out;
        }

        .polaroid-card:hover {
            transform: scale(1.03) rotate(1deg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .polaroid-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border: 1px solid #e2e8f0;
        }

        .polaroid-caption {
            font-family: 'Courier New', Courier, monospace;
            color: #1e293b;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            word-wrap: break-word;
            direction: ltr; /* عشان الـ Prompts بالإنجليزي تظهر مظبوطة */
        }

        /* الـ Skeleton Loader وقت التحميل */
        .skeleton-card {
            background: #27272a;
            border-radius: 12px;
            height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #3f3f46;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #3f3f46;
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 15px;
            color: #a1a1aa;
            font-size: 0.9rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>مُولد الصور السحري 🪄</h1>
    <p class="subtitle">اكتب خيالك بالإنجليزي وشوفه بيتحول لصورة واقعية استايل الـ Polaroid!</p>

    <div class="input-container">
        <input type="text" id="promptInput" placeholder="مثال: A cinematic polaroid photograph of a vintage neon cafe at night...">
        <button id="generateBtn" onclick="generateMagic()">توليد</button>
    </div>

    <div class="gallery-grid" id="galleryGrid">
        </div>

    <script>
        async function generateMagic() {
            const promptInput = document.getElementById('promptInput');
            const generateBtn = document.getElementById('generateBtn');
            const galleryGrid = document.getElementById('galleryGrid');
            
            const promptValue = promptInput.value.trim();
            
            if (!promptValue) {
                alert('يا غالي اكتب حاجة الأول في الصندوق عشان الـ AI يفهمك!');
                return;
            }

            // 1. قفل الزرار وتجهيز الـ UI لحالة التحميل
            generateBtn.disabled = true;
            generateBtn.innerText = 'جاري التوليد...';

            // 2. إنشاء كارت تحميل (Skeleton) مؤقت وضخه في أول المعرض
            const skeleton = document.createElement('div');
            skeleton.className = 'skeleton-card';
            skeleton.id = 'tempSkeleton';
            skeleton.innerHTML = `
                <div class="spinner"></div>
                <div class="loading-text">الـ AI بيرسم خيالك دلوقتي... (بياخد حوالي 10 ثواني)</div>
            `;
            galleryGrid.insertBefore(skeleton, galleryGrid.firstChild);

            try {
                // 3. إرسال الطلب للفلاسك Backend في الخلفية
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: promptValue })
                });

                const data = await response.json();

                // حذف كارت التحميل المؤقت
                document.getElementById('tempSkeleton').remove();

                if (data.success) {
                    // 4. السحر اشتغل! نكاريت كارت الـ Polaroid الجديد ونضيفه
                    const newCard = document.createElement('div');
                    newCard.className = 'polaroid-card';
                    newCard.innerHTML = `
                        <img src="${data.image_url}" alt="${promptValue}">
                        <div class="polaroid-caption">"${promptValue}"</div>
                    `;
                    // ضخ الكارت في أول الـ Grid عشان يظهر فوق
                    galleryGrid.insertBefore(newCard, galleryGrid.firstChild);
                    
                    // تنظيف صندوق الإدخال
                    promptInput.value = '';
                } else {
                    alert('حصلت مشكلة: ' + (data.error || 'فشل توليد الصورة'));
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('tempSkeleton').remove();
                alert('مشكلة في الاتصال بالسيرفر، تأكد إن الفلاسك شغال تمام.');
            } finally {
                // 5. رجع الزرار يشتغل تاني بعد ما العملية تخلص
                generateBtn.disabled = false;
                generateBtn.innerText = 'توليد';
            }
        }
    </script>
</body>
</html>
