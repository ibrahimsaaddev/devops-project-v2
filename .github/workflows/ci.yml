name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Docker Image
        run: docker build -t devops-project .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/devops-project-v2
            git pull
            docker compose up --build -d
      - name: Run Docker Container
        run: |
    docker exec -d web-app || true  # لو عندك أمر بيوقف القديم الأول
    docker run -d -p 5000:5000 --name web-app -e HF_TOKEN="${{ secrets.HF_TOKEN }}" username/devops-project-v2:latest  
